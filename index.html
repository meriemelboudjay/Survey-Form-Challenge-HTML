<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Survey Form Challenge</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>freeCodeCamp Survey Form</h1>
        <p>Thank you for taking the time to help us improve the platform</p>
    </header>
    <main id="main">
        <form action="#" method="post" id="form">
            <label for="name">Name</label>
                <br>
            <input type="text" name="name" id="name" placeholder="Enter your name" required/>
                <br><br>
            <label for="email">Email</label>
                <br>
            <input type="email" name="email" id="email" placeholder="Enter your Email" required/>
                <br><br>
            <label for="age">Age (optional)</label>
                <br>
            <input type="number" name="age" id="age" placeholder="Age" />
                <br><br>
            <label for="role">Which option best describes your current role ?</label>
                <br>
            <select name="role" id="role" required>
                <option value="" disabled selected>Select current role</option>
                <option value="Student">Student</option>
                <option value="Full-Time-Job">Full Time Job</option>
                <option value="Full-Time-Learner">Full Time Learner</option>
                <option value="Prefer-not-to-say">Prefer not to say</option>
                <option value="Other">Other</option>
            </select>
                <br><br>
            <label>Would you recommend freeCodeCamp to a friend ?</label>
                <br>
            <label>
                <input type="radio" name="recommendation" value="Definitely" checked>
                Definitely
            </label>
                <br>
            <label>
                <input type="radio" name="recommendation" value="Maybe">
                Maybe
            </label>
                <br>
            <label>
                <input type="radio" name="recommendation" value="Not-sure">
                Not sure
            </label>
                <br><br>
            <label for="favorite">What is your favorite feature of freeCodeCamp ?</label>
                <br>
            <select name="favorite" id="favorite" required>
                <option value="" disabled selected>Select an option</option>
                <option value="Challenges">Challenges</option>
                <option value="Projects">Projects</option>
                <option value="Community">Community</option>
                <option value="Open-Source">Open Source</option>
            </select>
                <br><br>
            <label>What would you like to see improved ? (Check all that apply)</label>
                <br>
            <label>
                <input type="checkbox" name="improvement"  value="Front-end-Projects">Front-end Projects
            </label>
                <br>
            <label>
                <input type="checkbox" name="improvement"  value="Back-end-Projects">Back-end Projects
            </label>
                <br>
            <label>
                <input type="checkbox" name="improvement"  value="Data-Visualization">Data Visualization
            </label>
                <br>
            <label>
                <input type="checkbox" name="improvement"  value="Challenges">Challenges
            </label>
                <br>
            <label>
                <input type="checkbox" name="improvement"  value="Open-Source-Community">Open Source Community
            </label>
                <br>
            <label>
                <input type="checkbox" name="improvement"  value="Gitter-help-rooms">Gitter help rooms
            </label>
                <br>
            <label>
                <input type="checkbox" name="improvement"  value="Videos">Videos
            </label>
                <br>
            <label>
                <input type="checkbox" name="improvement"  value="City-Meetups">City Meetups
            </label>
                <br>
            <label>
                <input type="checkbox" name="improvement"  value="Wiki">Wiki
            </label>
                <br>
            <label>
                <input type="checkbox" name="improvement"  value="Forum">Forum
            </label>
                <br>
            <label>
                <input type="checkbox" name="improvement"  value="Additional-Courses">Additional Courses
            </label>
                <br><br>
            <label for="comments" >Any comments or suggestions ? </label>
                <br>
            <textarea name="comments" id="comments"  placeholder="Enter your comment here ... "></textarea>
                <br><br>
            <input type="submit" value="Submit" id="submit" >
        </form>
    </main>
</body>
</html>
